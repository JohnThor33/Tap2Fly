<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap Fly</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: #222;
            font-family: 'Fredoka One', cursive;
            overflow: hidden;
            color: #fff;
        }

        /* Container Utama */
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #87CEEB 0%, #4682B4 100%);
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 40px; text-shadow: 2px 2px 0 #000; margin-bottom: 20px; text-align: center; line-height: 1.2; }
        h2 { font-size: 28px; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }

        .btn {
            background: #ffcc00; color: #333;
            border: 3px solid #fff; border-radius: 25px;
            padding: 12px 25px; font-size: 20px; font-family: inherit;
            margin: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        /* Profile & Leaderboard Styles */
        .profile-setup { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; text-align: center; width: 85%; max-width: 350px;}
        input[type="text"] {
            width: 100%; padding: 10px; border-radius: 10px; border: none;
            font-size: 16px; font-family: inherit; margin-bottom: 15px; text-align: center;
        }
        .prof-pic-preview {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff;
            background: #ccc; margin: 0 auto 15px auto; object-fit: cover; display: block;
        }
        input[type="file"] { display: none; }
        .upload-btn { background: #4caf50; font-size: 14px; padding: 8px 15px; margin-bottom: 15px; }

        .leaderboard-list {
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px;
            width: 90%; max-width: 350px; max-height: 50vh; overflow-y: auto; text-align: left;
        }
        .lb-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;}
        .lb-item img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; margin-right: 10px; }
        .lb-info { flex-grow: 1; display: flex; align-items: center;}
        .lb-score { font-size: 20px; color: #ffcc00; }

        /* Bird Selection */
        .bird-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .bird-card {
            background: rgba(255,255,255,0.2); border: 3px solid transparent;
            border-radius: 15px; padding: 10px; text-align: center; width: 100px;
        }
        .bird-card.selected { border-color: #ffcc00; background: rgba(255,255,255,0.5); }
        .bird-canvas { width: 60px; height: 60px; }

        /* In-Game UI */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #score-display {
            position: absolute; top: 20px; left: 0; width: 100%;
            text-align: center; font-size: 40px; color: #fff; text-shadow: 3px 3px 0 #000;
        }
        #fire-btn {
            position: absolute; bottom: 30px; right: 30px;
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ff4c4c, #b30000); border: 4px solid #fff;
            color: white; font-family: inherit; font-size: 20px; text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto; display: none;
        }
        #fire-btn:active { transform: scale(0.9); }
        #shield-bar {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 10px; display: none;
        }
        #shield-fill { height: 100%; background: #00ffff; border-radius: 8px; width: 100%; transition: width 0.1s linear;}

        /* Landscape Warning */
        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff4c4c; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #landscape-warning img { width: 100px; margin-bottom: 20px; transform: rotate(-90deg); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI IN GAME -->
    <div id="game-ui">
        <div id="score-display">0</div>
        <div id="shield-bar"><div id="shield-fill"></div></div>
        <button id="fire-btn">FIRE!</button>
    </div>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen">
        <h1>Tap Tap<br>Fly</h1>
        
        <div class="profile-setup">
            <img id="menu-prof-pic" class="prof-pic-preview" src="">
            <label class="btn upload-btn" for="file-upload">Unggah Foto Profil</label>
            <input type="file" id="file-upload" accept="image/*">
            <input type="text" id="player-name" placeholder="Masukkan Nama Kamu" maxlength="15">
        </div>

        <button class="btn" id="btn-play">Play</button>
        <button class="btn" id="btn-highscore">Papan Peringkat</button>
    </div>

    <!-- BIRD SELECTION -->
    <div id="bird-select-screen" class="screen hidden">
        <h2>Pilih Burungmu</h2>
        <div class="bird-grid" id="bird-grid">
            <!-- Diisi JS -->
        </div>
        <button class="btn" id="btn-start-game">Mulai Tantangan!</button>
        <button class="btn" id="btn-back-menu-from-bird" style="background:#ff4c4c; font-size: 16px;">Kembali</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard-screen" class="screen hidden">
        <h2>Top 5 Highscore</h2>
        <div class="leaderboard-list" id="lb-list">
            <!-- Diisi JS -->
        </div>
        <button class="btn" id="btn-back-menu">Menu Utama</button>
    </div>

    <!-- GAME OVER -->
    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.8);">
        <h1 style="color: #ff4c4c;">GAME OVER</h1>
        <h2 id="go-score">Score: 0</h2>
        <h2 id="go-highscore" style="color:#ffcc00; font-size:20px; margin-bottom: 30px;">Highscore: 0</h2>
        <button class="btn" id="btn-restart">Main Lagi</button>
        <button class="btn" id="btn-exit" style="background: #ff4c4c;">Exit</button>
    </div>
</div>

<!-- LANDSCAPE WARNING -->
<div id="landscape-warning" class="hidden">
    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(90deg); margin-bottom: 20px;"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
    <h1 style="text-shadow:none;">Hp nya gak boleh rebahan ya!</h1>
    <p>Putar kembali HP kamu ke posisi berdiri (Portrait) untuk melanjutkan permainan.</p>
</div>

<script>
    /* ====================================================================
       HOOKS UNTUK SOUND EFFECT (Silakan isi logika Audio Play disini nanti)
       ==================================================================== */
    function playBGM() { console.log("BGM Play"); }
    function stopBGM() { console.log("BGM Stop"); }
    function playSoundItem() { console.log("SFX: Item Got!"); }
    function playSoundShoot() { console.log("SFX: Pew!"); }
    function playSoundExplosion() { console.log("SFX: Boom!"); }
    function playSoundGameOver() { console.log("SFX: Game Over!"); }
    function playSoundFlap() { /* Opsional: Suara kepak sayap */ }

    /* ====================================================================
       KONFIGURASI & VARIABEL GLOBAL
       ==================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const screens = {
        menu: document.getElementById('menu-screen'),
        bird: document.getElementById('bird-select-screen'),
        gameover: document.getElementById('gameover-screen'),
        leaderboard: document.getElementById('leaderboard-screen'),
        warning: document.getElementById('landscape-warning')
    };
    const ui = {
        score: document.getElementById('score-display'),
        fireBtn: document.getElementById('fire-btn'),
        shieldBar: document.getElementById('shield-bar'),
        shieldFill: document.getElementById('shield-fill')
    };

    let w, h;
    let gameState = 'MENU'; // MENU, BIRD, PLAY, GAMEOVER
    let isPaused = false;
    let animationId;

    // Profil Player
    let playerProfile = {
        name: "Player1",
        photo: "", // base64
        highscore: 0
    };
    
    // Burung
    const birdColors = [
        { id:1, name: "Biru", color: "#add8e6" },
        { id:2, name: "Pink", color: "#ffb6c1" },
        { id:3, name: "Merah", color: "#ff4c4c" },
        { id:4, name: "Kuning", color: "#fce803" },
        { id:5, name: "Hijau", color: "#90ee90" }
    ];
    let selectedBirdIdx = 0;

    // Game Variables
    let frames = 0;
    let score = 0;
    let obstaclesPassed = 0;
    let bgLevel = 0; // 0 sampai 4
    
    let bird = { x: 0, y: 0, w: 34, h: 26, velocity: 0, gravity: 0.25, jump: -5.5 };
    let pipes = [];
    let items = [];
    let bullets = [];
    let particles = [];
    let bgParticles = []; // Untuk sakura / bintang
    
    let gameTimeSeconds = 0;
    let lastTime = 0;

    // Powerup State
    let isShielded = false;
    let shieldTimer = 0; // max 5 detik
    let hasBullet = false;
    
    const PIPE_W = 60;
    const PIPE_SPEED = 2.5;

    /* ====================================================================
       INIT & EVENT LISTENERS UMUM
       ==================================================================== */
    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        checkOrientation();
    }
    window.addEventListener('resize', resize);
    
    function checkOrientation() {
        if (window.innerWidth > window.innerHeight && window.innerWidth > 600) {
            screens.warning.classList.remove('hidden');
            if(gameState === 'PLAY') isPaused = true;
        } else {
            screens.warning.classList.add('hidden');
            if(gameState === 'PLAY') {
                isPaused = false;
                lastTime = performance.now();
                gameLoop(lastTime); // Resume
            }
        }
    }

    // Load Data
    function loadData() {
        let data = localStorage.getItem('tapTapFlyData');
        if(data) {
            let parsed = JSON.parse(data);
            playerProfile.name = parsed.name || "Player1";
            playerProfile.photo = parsed.photo || "";
            document.getElementById('player-name').value = playerProfile.name;
            if(playerProfile.photo) {
                document.getElementById('menu-prof-pic').src = playerProfile.photo;
            } else {
                drawDefaultAvatar(document.getElementById('menu-prof-pic'));
            }
        } else {
            drawDefaultAvatar(document.getElementById('menu-prof-pic'));
        }
    }

    function saveData() {
        playerProfile.name = document.getElementById('player-name').value || "Player1";
        localStorage.setItem('tapTapFlyData', JSON.stringify(playerProfile));
    }

    // Default Avatar (Fallback)
    function drawDefaultAvatar(imgElement) {
        let tc = document.createElement('canvas');
        tc.width = 100; tc.height = 100;
        let tctx = tc.getContext('2d');
        tctx.fillStyle = '#ccc'; tctx.fillRect(0,0,100,100);
        tctx.fillStyle = '#fff'; tctx.font = '50px Fredoka One'; tctx.textAlign = 'center'; tctx.textBaseline='middle';
        tctx.fillText('?', 50, 50);
        imgElement.src = tc.toDataURL();
    }

    // File Upload Profile Pic (Resize agar base64 tidak terlalu besar)
    document.getElementById('file-upload').addEventListener('change', function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const max_size = 150;
                let tc = document.createElement('canvas');
                let size = Math.min(img.width, img.height);
                tc.width = max_size; tc.height = max_size;
                let tctx = tc.getContext('2d');
                // Crop kotak tengah
                let sx = (img.width - size)/2;
                let sy = (img.height - size)/2;
                tctx.drawImage(img, sx, sy, size, size, 0, 0, max_size, max_size);
                
                let base64 = tc.toDataURL('image/jpeg', 0.8);
                document.getElementById('menu-prof-pic').src = base64;
                playerProfile.photo = base64;
                saveData();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    // Navigasi Menu
    document.getElementById('btn-play').addEventListener('click', () => {
        saveData();
        showScreen('bird');
        generateBirdSelection();
    });
    
    document.getElementById('btn-highscore').addEventListener('click', () => {
        saveData();
        showScreen('leaderboard');
        renderLeaderboard();
    });

    document.getElementById('btn-back-menu').addEventListener('click', () => showScreen('menu'));
    document.getElementById('btn-back-menu-from-bird').addEventListener('click', () => showScreen('menu'));
    
    document.getElementById('btn-start-game').addEventListener('click', () => {
        showScreen('game');
        startGame();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
        showScreen('game');
        startGame();
    });

    document.getElementById('btn-exit').addEventListener('click', () => {
        stopBGM();
        showScreen('menu');
    });

    function showScreen(screen) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        if(screen === 'menu') { screens.menu.classList.remove('hidden'); gameState = 'MENU'; }
        else if(screen === 'bird') { screens.bird.classList.remove('hidden'); gameState = 'BIRD'; }
        else if(screen === 'leaderboard') { screens.leaderboard.classList.remove('hidden'); gameState = 'MENU'; }
        else if(screen === 'gameover') { screens.gameover.classList.remove('hidden'); gameState = 'GAMEOVER'; }
        else if(screen === 'game') { gameState = 'PLAY'; }
    }

    /* ====================================================================
       BIRD SELECTION & DRAWING
       ==================================================================== */
    function drawCuteBird(ctx, x, y, size, color, flyFrame = 0) {
        ctx.save();
        ctx.translate(x, y);
        
        // Body
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size*0.8, 0, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();

        // White Belly
        ctx.beginPath();
        ctx.arc(0, size*0.1, size*0.7, 0, Math.PI, false);
        ctx.fillStyle = "#fff";
        ctx.fill();

        // Eye
        ctx.beginPath();
        ctx.arc(size*0.4, -size*0.2, size*0.15, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(size*0.45, -size*0.2, size*0.06, 0, Math.PI*2);
        ctx.fillStyle = '#000'; ctx.fill();

        // Beak
        ctx.beginPath();
        ctx.moveTo(size*0.8, 0);
        ctx.lineTo(size*1.2, 0);
        ctx.lineTo(size*0.8, size*0.3);
        ctx.fillStyle = '#FFA500'; ctx.fill(); ctx.stroke();

        // Wing (Flap animation)
        let wingY = Math.sin(flyFrame * 0.5) * 5; 
        ctx.beginPath();
        ctx.ellipse(-size*0.2, wingY, size*0.4, size*0.25, -Math.PI/6, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    function generateBirdSelection() {
        const grid = document.getElementById('bird-grid');
        grid.innerHTML = '';
        birdColors.forEach((b, idx) => {
            let card = document.createElement('div');
            card.className = `bird-card ${idx === selectedBirdIdx ? 'selected' : ''}`;
            
            let canv = document.createElement('canvas');
            canv.className = 'bird-canvas';
            canv.width = 60; canv.height = 60;
            let cctx = canv.getContext('2d');
            drawCuteBird(cctx, 30, 30, 20, b.color, 0);
            
            let label = document.createElement('div');
            label.innerText = b.name; label.style.fontSize = '12px'; label.style.marginTop = '5px';

            card.appendChild(canv);
            card.appendChild(label);
            
            card.addEventListener('click', () => {
                selectedBirdIdx = idx;
                generateBirdSelection(); // re-render selected
            });
            grid.appendChild(card);
        });
    }

    /* ====================================================================
       LEADERBOARD SYSTEM
       ==================================================================== */
    function getLeaderboard() {
        let lb = localStorage.getItem('tapTapFlyLB');
        return lb ? JSON.parse(lb) : [];
    }

    function saveToLeaderboard(score) {
        let lb = getLeaderboard();
        lb.push({ name: playerProfile.name, photo: playerProfile.photo, score: score });
        // Sort & Keep Top 5
        lb.sort((a,b) => b.score - a.score);
        lb = lb.slice(0, 5);
        localStorage.setItem('tapTapFlyLB', JSON.stringify(lb));
    }

    function renderLeaderboard() {
        const list = document.getElementById('lb-list');
        list.innerHTML = '';
        let lb = getLeaderboard();
        if(lb.length === 0) {
            list.innerHTML = '<div style="text-align:center;">Belum ada data</div>';
            return;
        }
        lb.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'lb-item';
            
            let imgSrc = item.photo ? item.photo : ''; // we need logic for default
            let imgHtml = item.photo ? `<img src="${item.photo}">` : `<div style="width:40px;height:40px;border-radius:50%;background:#ccc;margin-right:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">?</div>`;
            
            div.innerHTML = `
                <div class="lb-info">
                    <b style="margin-right:10px;">#${index+1}</b>
                    ${imgHtml}
                    <span>${item.name}</span>
                </div>
                <div class="lb-score">${item.score}</div>
            `;
            list.appendChild(div);
        });
    }

    /* ====================================================================
       GAME ENGINE & LOGIC
       ==================================================================== */
    function startGame() {
        // Reset Variables
        bird.x = w * 0.3;
        bird.y = h / 2;
        bird.velocity = 0;
        
        pipes = [];
        items = [];
        bullets = [];
        particles = [];
        bgParticles = [];
        
        frames = 0;
        score = 0;
        obstaclesPassed = 0;
        bgLevel = 0;
        gameTimeSeconds = 0;
        
        isShielded = false;
        shieldTimer = 0;
        hasBullet = false;
        ui.fireBtn.style.display = 'none';
        ui.shieldBar.style.display = 'none';
        ui.score.innerText = "0";

        initBgParticles();
        playBGM();
        
        lastTime = performance.now();
        if(animationId) cancelAnimationFrame(animationId);
        gameLoop(lastTime);
    }

    // Input Control
    function fly() {
        if (gameState !== 'PLAY' || isPaused) return;
        bird.velocity = bird.jump;
        playSoundFlap();
    }
    
    // Support Touch dan Mouse
    window.addEventListener('touchstart', (e) => {
        if(e.target.id === 'fire-btn') return; // di-handle terpisah
        fly();
    }, {passive: false});
    window.addEventListener('mousedown', (e) => {
        if(e.target.id === 'fire-btn') return;
        fly();
    });

    // Tombol Fire
    ui.fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    ui.fireBtn.addEventListener('mousedown', (e) => { e.preventDefault(); shoot(); });

    function shoot() {
        if(hasBullet && gameState === 'PLAY' && !isPaused) {
            hasBullet = false;
            ui.fireBtn.style.display = 'none';
            playSoundShoot();
            bullets.push({ x: bird.x + bird.w, y: bird.y, w: 15, h: 8, speed: 10 });
        }
    }

    function createExplosion(x, y, color) {
        playSoundExplosion();
        for(let i=0; i<20; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 30, maxLife: 30, color: color, size: Math.random()*5 + 3
            });
        }
    }

    // GAME LOOP
    function gameLoop(currentTime) {
        if (gameState !== 'PLAY') return;
        if (isPaused) {
            animationId = requestAnimationFrame(gameLoop);
            return;
        }

        let dt = (currentTime - lastTime) / 1000; // delta time in seconds
        lastTime = currentTime;
        gameTimeSeconds += dt;

        update(dt);
        draw();

        animationId = requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        frames++;

        // Bird Physics
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Ground / Ceiling Collision
        if (bird.y + bird.h/2 >= h || bird.y - bird.h/2 <= 0) {
            gameOver();
        }

        // --- PIPES ---
        if (frames % 100 === 0) { // Spawn interval
            let gap = 160 - (bgLevel * 5); // Semakin tinggi level, gap makin sempit sedikit
            if (gap < 100) gap = 100;
            let pipeY = Math.random() * (h - gap - 100) + 50;
            pipes.push({ x: w, y: pipeY, w: PIPE_W, gap: gap, passed: false });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= PIPE_SPEED;

            // Score update
            if (!p.passed && bird.x > p.x + p.w) {
                p.passed = true;
                obstaclesPassed++;
                score += 10;
                ui.score.innerText = score;
                
                // Cek ganti background tiap 15 rintangan (150 poin)
                if(obstaclesPassed % 15 === 0) {
                    bgLevel = (bgLevel + 1) % 5;
                    initBgParticles();
                }
            }

            // Collision Pipe vs Bird
            if (!isShielded) {
                // Atas
                if (bird.x + bird.w/2 > p.x && bird.x - bird.w/2 < p.x + p.w &&
                    bird.y - bird.h/2 < p.y) {
                    gameOver();
                }
                // Bawah
                if (bird.x + bird.w/2 > p.x && bird.x - bird.w/2 < p.x + p.w &&
                    bird.y + bird.h/2 > p.y + p.gap) {
                    gameOver();
                }
            }

            // Remove off-screen pipes
            if (p.x + p.w < 0) {
                pipes.splice(i, 1);
            }
        }

        // --- ITEMS SPAWN (Berdasarkan waktu) ---
        // Shield (Tiap 15s)
        if (gameTimeSeconds % 15 < dt && gameTimeSeconds > 5) {
            items.push({ x: w, y: Math.random()*(h-200)+100, type: 'shield', r: 15 });
        }
        // Shoot (Tiap 25s)
        if (gameTimeSeconds % 25 < dt && gameTimeSeconds > 5) {
            items.push({ x: w, y: Math.random()*(h-200)+100, type: 'shoot', r: 15 });
        }

        // Item Logic
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.x -= PIPE_SPEED;

            // Float animasi
            item.y += Math.sin(frames * 0.05) * 1;

            // Collision
            let dx = bird.x - item.x;
            let dy = bird.y - item.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < bird.w/2 + item.r) {
                playSoundItem();
                if (item.type === 'shield') {
                    isShielded = true;
                    shieldTimer = 5; // 5 seconds
                    ui.shieldBar.style.display = 'block';
                } else if (item.type === 'shoot') {
                    hasBullet = true;
                    ui.fireBtn.style.display = 'block';
                }
                items.splice(i, 1);
                continue;
            }

            if (item.x + item.r < 0) items.splice(i, 1);
        }

        // Update Shield Timer
        if (isShielded) {
            shieldTimer -= dt;
            ui.shieldFill.style.width = (shieldTimer / 5 * 100) + "%";
            if (shieldTimer <= 0) {
                isShielded = false;
                ui.shieldBar.style.display = 'none';
            }
        }

        // --- BULLETS LOGIC ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.speed;
            
            // Hit Pipe Check
            let hit = false;
            for(let j = 0; j < pipes.length; j++) {
                let p = pipes[j];
                // Cek hitbox peluru kena dinding atas atau bawah pipa
                if (b.x + b.w > p.x && b.x < p.x + p.w) {
                    if (b.y < p.y || b.y > p.y + p.gap) {
                        // HIT! Hancurkan pipa ini
                        createExplosion(p.x + p.w/2, p.y - 20, '#55cc55'); // Efek ledakan pipa
                        createExplosion(p.x + p.w/2, p.y + p.gap + 20, '#55cc55');
                        pipes.splice(j, 1);
                        hit = true;
                        
                        // Tetap hitung skor agar player gak rugi
                        if(!p.passed) {
                            obstaclesPassed++;
                            score += 10;
                            ui.score.innerText = score;
                            if(obstaclesPassed % 15 === 0) { bgLevel = (bgLevel + 1) % 5; initBgParticles(); }
                        }
                        break;
                    }
                }
            }
            
            if(hit) { bullets.splice(i, 1); continue; }
            if (b.x > w) bullets.splice(i, 1);
        }

        // --- PARTICLES (Explosions) ---
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // --- BG PARTICLES (Sakura, Stars) ---
        for (let i = 0; i < bgParticles.length; i++) {
            let p = bgParticles[i];
            p.x += p.vx; p.y += p.vy;
            if(bgLevel === 1) { // Sakura
                if(p.y > h) { p.y = -10; p.x = Math.random()*w; }
            } else if (bgLevel === 3) { // Space Stars
                if(p.x < 0) { p.x = w; p.y = Math.random()*h; }
            }
        }
    }

    /* ====================================================================
       DRAWING ROUTINES
       ==================================================================== */
    function initBgParticles() {
        bgParticles = [];
        if (bgLevel === 1) { // Sakura
            for(let i=0; i<30; i++) {
                bgParticles.push({
                    x: Math.random()*w, y: Math.random()*h,
                    vx: -1 - Math.random(), vy: 1 + Math.random()*2,
                    size: Math.random()*4 + 2, angle: Math.random()*360
                });
            }
        } else if (bgLevel === 2 || bgLevel === 3) { // Stars
            for(let i=0; i<50; i++) {
                bgParticles.push({
                    x: Math.random()*w, y: Math.random()*h,
                    vx: bgLevel===3 ? -0.5 - Math.random() : 0, vy: 0,
                    size: Math.random()*2 + 1, twinkle: Math.random()
                });
            }
        }
    }

    function drawBackground() {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        
        // bgLevel: 0=Langit Biru, 1=Pink/Sakura, 2=Malam, 3=Luar Angkasa, 4=Sunset
        if (bgLevel === 0) {
            grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            // Draw clouds
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath(); ctx.arc(w*0.2 - (frames*0.2)%w, h*0.2, 30, 0, Math.PI*2); ctx.arc(w*0.2+30 - (frames*0.2)%w, h*0.2+10, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w*0.8 - (frames*0.1)%w, h*0.3, 40, 0, Math.PI*2); ctx.arc(w*0.8-30 - (frames*0.1)%w, h*0.3+10, 30, 0, Math.PI*2); ctx.fill();
        } 
        else if (bgLevel === 1) {
            grad.addColorStop(0, '#FFB7C5'); grad.addColorStop(1, '#FFE4E1');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            // Sakura Particles
            ctx.fillStyle = '#FF69B4';
            bgParticles.forEach(p => {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(frames*0.05 + p.angle);
                ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size/2, 0, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });
        }
        else if (bgLevel === 2) {
            grad.addColorStop(0, '#0B0B2A'); grad.addColorStop(1, '#1A1A4A');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            // Moon
            ctx.fillStyle = '#FFF8DC'; ctx.beginPath(); ctx.arc(w*0.8, h*0.15, 40, 0, Math.PI*2); ctx.fill();
            // Stars
            ctx.fillStyle = '#FFF';
            bgParticles.forEach(p => {
                let alpha = Math.abs(Math.sin(frames*0.02 + p.twinkle*10));
                ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        else if (bgLevel === 3) {
            grad.addColorStop(0, '#000000'); grad.addColorStop(1, '#2E0854');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            // Planet
            ctx.fillStyle = '#FF4500'; ctx.beginPath(); ctx.arc(w*0.2, h*0.7, 60, 0, Math.PI*2); ctx.fill();
            // Moving stars
            ctx.fillStyle = '#FFF';
            bgParticles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
        }
        else if (bgLevel === 4) {
            grad.addColorStop(0, '#FF4E50'); grad.addColorStop(0.5, '#F9D423'); grad.addColorStop(1, '#FF8008');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            // Sun
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath(); ctx.arc(w/2, h, w*0.4, 0, Math.PI, true); ctx.fill();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        
        drawBackground();

        // Draw Pipes
        ctx.fillStyle = '#73BF2E'; // Hijau pipa
        ctx.strokeStyle = '#548F22';
        ctx.lineWidth = 4;
        pipes.forEach(p => {
            // Top Pipe
            ctx.fillRect(p.x, 0, p.w, p.y);
            ctx.strokeRect(p.x, 0, p.w, p.y);
            // Cap Top
            ctx.fillRect(p.x-5, p.y-20, p.w+10, 20); ctx.strokeRect(p.x-5, p.y-20, p.w+10, 20);
            
            // Bottom Pipe
            let bottomY = p.y + p.gap;
            ctx.fillRect(p.x, bottomY, p.w, h - bottomY);
            ctx.strokeRect(p.x, bottomY, p.w, h - bottomY);
            // Cap Bottom
            ctx.fillRect(p.x-5, bottomY, p.w+10, 20); ctx.strokeRect(p.x-5, bottomY, p.w+10, 20);
        });

        // Draw Items (Orbs)
        items.forEach(item => {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.r, 0, Math.PI*2);
            if(item.type === 'shield') {
                ctx.fillStyle = 'rgba(173, 216, 230, 0.8)'; // Biru muda
                ctx.strokeStyle = '#00ffff';
            } else {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.8)'; // Merah
                ctx.strokeStyle = '#ffcccc';
            }
            ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
            // Glow
            ctx.beginPath(); ctx.arc(item.x - item.r*0.3, item.y - item.r*0.3, item.r*0.2, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.fill();
        });

        // Draw Bullets
        ctx.fillStyle = '#ffcc00'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        bullets.forEach(b => {
            ctx.beginPath(); ctx.ellipse(b.x, b.y, b.w, b.h, 0, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
            // Trail
            ctx.fillStyle = 'rgba(255,0,0,0.5)'; ctx.beginPath(); ctx.arc(b.x - b.w, b.y, 4, 0, Math.PI*2); ctx.fill();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Bird
        let color = birdColors[selectedBirdIdx].color;
        if (isShielded) { // Efek aura shield
            ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.w, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.4)'; ctx.fill();
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
        }
        drawCuteBird(ctx, bird.x, bird.y, bird.w/2, color, frames);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        playSoundGameOver();
        stopBGM();

        // Hancurkan burung jadi particle
        createExplosion(bird.x, bird.y, birdColors[selectedBirdIdx].color);
        draw(); // draw final frame dgn ledakan
        
        // Simpan score
        let storedScore = parseInt(playerProfile.highscore) || 0;
        if(score > storedScore) {
            playerProfile.highscore = score;
            saveData();
        }
        saveToLeaderboard(score);

        setTimeout(() => {
            document.getElementById('go-score').innerText = "Score: " + score;
            document.getElementById('go-highscore').innerText = "Highscore: " + playerProfile.highscore;
            showScreen('gameover');
        }, 800); // Jeda bentar biar ledakan terlihat
    }

    // Init Paling Awal
    resize();
    loadData();

</script>
