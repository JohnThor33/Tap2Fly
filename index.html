<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tap Tap Fly</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

        :root {
            --color-sky-top: #6EC6FF;
            --color-sky-bottom: #2E7BC7;
            --color-accent: #FFB84D;
            --color-accent-dark: #E8951F;
            --color-danger: #FF6B6B;
            --color-danger-dark: #DE4B4B;
            --color-success: #47D18C;
            --color-cyan: #3ED6D6;
            --color-ink: #1B1F3B;
            --color-cream: #FFFDF7;
            --font-display: 'Fredoka One', cursive;
            --font-body: 'Nunito', sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: #222;
            font-family: var(--font-body);
            overflow: hidden;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        button, input { font-family: var(--font-body); }
        :focus-visible { outline: 3px solid #fff; outline-offset: 2px; border-radius: 6px; }

        /* Container Utama */
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(180deg, var(--color-sky-top) 0%, var(--color-sky-bottom) 100%);
            z-index: 10;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            overflow: hidden;
        }
        .hidden { display: none !important; }

        .menu-decor { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .cloud { position: absolute; background: rgba(255,255,255,.55); border-radius: 50%; filter: blur(1px); animation: floatCloud linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
        .cloud-1 { width: 70px; height: 26px; top: 14%; left: -20%; animation-duration: 26s; }
        .cloud-1::before { width: 36px; height: 36px; top: -16px; left: 8px; }
        .cloud-1::after { width: 26px; height: 26px; top: -10px; left: 38px; }
        .cloud-2 { width: 50px; height: 20px; top: 46%; left: -25%; animation-duration: 20s; animation-delay: -8s; }
        .cloud-2::before { width: 26px; height: 26px; top: -12px; left: 6px; }
        .cloud-2::after { width: 20px; height: 20px; top: -8px; left: 26px; }
        .cloud-3 { width: 60px; height: 22px; top: 72%; left: -30%; animation-duration: 32s; animation-delay: -15s; }
        .cloud-3::before { width: 30px; height: 30px; top: -14px; left: 8px; }
        .cloud-3::after { width: 22px; height: 22px; top: -9px; left: 32px; }
        @keyframes floatCloud { from { transform: translateX(0); } to { transform: translateX(160vw); } }

        h1 { font-family: var(--font-display); font-size: 40px; text-shadow: 2px 2px 0 #000; margin-bottom: 20px; text-align: center; line-height: 1.2; position: relative; z-index: 1; }
        h2 { font-family: var(--font-display); font-size: 28px; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; position: relative; z-index: 1; }

        .btn {
            background: linear-gradient(180deg, var(--color-accent), var(--color-accent-dark));
            color: var(--color-ink);
            border: 3px solid #fff; border-radius: 999px;
            padding: 12px 25px; font-size: 20px; font-family: var(--font-display);
            margin: 10px; box-shadow: 0 4px 0 var(--color-accent-dark), 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.08s, box-shadow 0.08s;
            position: relative; z-index: 1;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--color-accent-dark), 0 2px 4px rgba(0,0,0,0.3); }
        .btn-danger {
            background: linear-gradient(180deg, var(--color-danger), var(--color-danger-dark));
            color: #fff;
            box-shadow: 0 4px 0 var(--color-danger-dark), 0 6px 10px rgba(0,0,0,0.3);
        }
        .btn-danger:active { box-shadow: 0 1px 0 var(--color-danger-dark), 0 2px 4px rgba(0,0,0,0.3); }

        .new-high-badge {
            font-family: var(--font-display); color: var(--color-accent); font-size: 18px;
            text-shadow: 2px 2px 0 #000; margin-bottom: 8px; animation: badgeBounce 0.5s ease;
        }
        @keyframes badgeBounce {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* Profile & Leaderboard Styles */
        .profile-setup { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; text-align: center; width: 85%; max-width: 350px; position: relative; z-index: 1; backdrop-filter: blur(4px);}
        input[type="text"] {
            width: 100%; padding: 10px; border-radius: 10px; border: none;
            font-size: 16px; font-family: var(--font-body); font-weight: 700; margin-bottom: 5px; text-align: center;
        }
        .avatar-upload { position: relative; display: inline-block; cursor: pointer; margin-bottom: 15px; }
        .avatar-edit-badge {
            position: absolute; bottom: 0; right: -2px; width: 26px; height: 26px; border-radius: 50%;
            background: var(--color-accent); border: 2px solid var(--color-cream); display: flex;
            align-items: center; justify-content: center; font-size: 13px; color: var(--color-ink);
            box-shadow: 0 2px 4px rgba(0,0,0,.35);
        }
        .prof-pic-preview {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff;
            background: #ccc; margin: 0 auto; object-fit: cover; display: block;
        }
        input[type="file"] { display: none; }
        .profile-hint { font-size: 12px; opacity: .75; margin: 0 0 12px 0; font-weight: 600; }

        .leaderboard-list {
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px;
            width: 90%; max-width: 350px; max-height: 50vh; overflow-y: auto; text-align: left;
            position: relative; z-index: 1;
        }
        .lb-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); padding: 6px 6px 8px; border-radius: 10px; }
        .lb-item img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; margin-right: 10px; object-fit: cover; }
        .lb-default-pic { width: 40px; height: 40px; border-radius: 50%; background: #ccc; margin-right: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; font-weight: 800; color: #555; }
        .lb-info { flex-grow: 1; display: flex; align-items: center; font-family: var(--font-body); font-weight: 700; overflow: hidden; }
        .lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-rank { font-size: 17px; margin-right: 8px; min-width: 26px; text-align: center; font-family: var(--font-display); }
        .lb-score { font-family: var(--font-display); font-size: 20px; color: #ffcc00; flex-shrink: 0; padding-left: 8px; }
        .lb-rank-1 { background: linear-gradient(90deg, rgba(255,215,0,0.25), rgba(255,255,255,0.03)); }
        .lb-rank-2 { background: linear-gradient(90deg, rgba(210,210,220,0.22), rgba(255,255,255,0.03)); }
        .lb-rank-3 { background: linear-gradient(90deg, rgba(205,127,50,0.22), rgba(255,255,255,0.03)); }
        .lb-empty { text-align: center; padding: 30px 10px; font-family: var(--font-body); font-weight: 700; opacity: .85; line-height: 1.8; }

        /* Bird Selection */
        .bird-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; position: relative; z-index: 1; }
        .bird-card {
            background: rgba(255,255,255,0.2); border: 3px solid transparent;
            border-radius: 15px; padding: 10px; text-align: center; width: 100px;
            position: relative; cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .bird-card:active { transform: scale(0.94); }
        .bird-card.selected {
            border-color: var(--color-accent); background: rgba(255,255,255,0.55);
            box-shadow: 0 0 0 4px rgba(255,184,77,.35), 0 4px 10px rgba(0,0,0,.25);
            transform: translateY(-2px);
        }
        .bird-card.selected::after {
            content: '✓'; position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
            border-radius: 50%; background: var(--color-success); color: #fff; font-size: 13px;
            display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
            box-shadow: 0 2px 4px rgba(0,0,0,.3);
        }
        .bird-card div { font-family: var(--font-body); font-weight: 700; }
        .bird-canvas { width: 60px; height: 60px; }

        /* In-Game UI */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #score-display {
            position: absolute; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            text-align: center; font-family: var(--font-display); font-size: 34px; color: #fff; text-shadow: 3px 3px 0 #000;
            background: rgba(27,31,59,0.35); backdrop-filter: blur(6px);
            padding: 4px 26px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.45);
            min-width: 70px;
        }
        #score-display.score-pop { animation: scorePop 0.25s ease-out; }
        @keyframes scorePop {
            0% { transform: translateX(-50%) scale(1); }
            35% { transform: translateX(-50%) scale(1.18); }
            100% { transform: translateX(-50%) scale(1); }
        }
        #fire-btn {
            position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); right: max(30px, env(safe-area-inset-right));
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ff4c4c, #b30000); border: 4px solid #fff;
            color: white; font-family: var(--font-display); font-size: 13px; text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            animation: firePulse 1.4s ease-out infinite;
        }
        #fire-btn .fire-icon { font-size: 22px; line-height: 1; }
        #fire-btn:active { transform: scale(0.9); }
        @keyframes firePulse {
            0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 0 0 rgba(255,76,76,0.55); }
            50% { box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 0 10px rgba(255,76,76,0); }
        }
        #shield-bar {
            position: absolute; top: max(70px, calc(env(safe-area-inset-top) + 60px)); left: 50%; transform: translateX(-50%);
            width: 200px; height: 16px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 999px; display: none;
            padding: 2px;
        }
        #shield-bar::before {
            content: '🛡'; position: absolute; left: -28px; top: 50%; transform: translateY(-50%);
            font-size: 17px; filter: drop-shadow(0 0 4px rgba(62,214,214,.9));
        }
        #shield-fill { height: 100%; background: linear-gradient(90deg, var(--color-cyan), #a4f7f7); border-radius: 999px; width: 100%; transition: width 0.1s linear; box-shadow: 0 0 8px rgba(62,214,214,.8);}

        /* Landscape Warning */
        #landscape-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--color-danger); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #landscape-warning svg { margin-bottom: 20px; animation: tiltPhone 1.6s ease-in-out infinite; }
        #landscape-warning h1 { font-size: 26px; }
        #landscape-warning p { font-family: var(--font-body); font-weight: 700; font-size: 15px; opacity: .95; max-width: 320px; }
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(90deg); }
            50% { transform: rotate(75deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cloud, #fire-btn, #score-display.score-pop, .new-high-badge, .bird-card, #landscape-warning svg {
                animation: none !important; transition: none !important;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI IN GAME -->
    <div id="game-ui">
        <div id="score-display">0</div>
        <div id="shield-bar" role="progressbar" aria-label="Sisa waktu shield"><div id="shield-fill"></div></div>
        <button id="fire-btn" aria-label="Tembak pipa">
            <span class="fire-icon" aria-hidden="true">⚡</span>
            <span>FIRE</span>
        </button>
    </div>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen">
        <div class="menu-decor" aria-hidden="true">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
        </div>
        <h1>Tap Tap<br>Fly</h1>

        <div class="profile-setup">
            <label class="avatar-upload" for="file-upload" aria-label="Ubah foto profil">
                <img id="menu-prof-pic" class="prof-pic-preview" src="" alt="Foto profil">
                <span class="avatar-edit-badge" aria-hidden="true">✎</span>
            </label>
            <input type="file" id="file-upload" accept="image/*">
            <p class="profile-hint">Ketuk foto untuk mengganti</p>
            <input type="text" id="player-name" placeholder="Masukkan Nama Kamu" maxlength="15">
        </div>

        <button class="btn" id="btn-play">Play</button>
        <button class="btn" id="btn-highscore">Papan Peringkat</button>
    </div>

    <!-- BIRD SELECTION -->
    <div id="bird-select-screen" class="screen hidden">
        <h2>Pilih Burungmu</h2>
        <div class="bird-grid" id="bird-grid">
            <!-- Diisi JS -->
        </div>
        <button class="btn" id="btn-start-game">Mulai Tantangan!</button>
        <button class="btn btn-danger" id="btn-back-menu-from-bird" style="font-size: 16px;">Kembali</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard-screen" class="screen hidden">
        <h2>Top 5 Highscore</h2>
        <div class="leaderboard-list" id="lb-list">
            <!-- Diisi JS -->
        </div>
        <button class="btn" id="btn-back-menu">Menu Utama</button>
    </div>

    <!-- GAME OVER -->
    <div id="gameover-screen" class="screen hidden" style="background: rgba(0,0,0,0.8);">
        <h1 style="color: var(--color-danger);">GAME OVER</h1>
        <div id="new-high-badge" class="new-high-badge hidden">✨ Rekor Baru! ✨</div>
        <h2 id="go-score">Score: 0</h2>
        <h2 id="go-highscore" style="color: var(--color-accent); font-size:20px; margin-bottom: 30px;">Highscore: 0</h2>
        <button class="btn" id="btn-restart">Main Lagi</button>
        <button class="btn btn-danger" id="btn-exit">Exit</button>
    </div>
</div>

<!-- LANDSCAPE WARNING -->
<div id="landscape-warning" class="hidden">
    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
    <h1 style="text-shadow:none;">Hp nya gak boleh rebahan ya!</h1>
    <p>Putar kembali HP kamu ke posisi berdiri (Portrait) untuk melanjutkan permainan.</p>
</div>

<script>
    /* ====================================================================
       FIREBASE REALTIME DATABASE CONFIG
       ==================================================================== */
    const FIREBASE_URL = "https://taptapfly-ff307-default-rtdb.asia-southeast1.firebasedatabase.app/leaderboard.json";

    /* ====================================================================
       HOOKS UNTUK SOUND EFFECT (Silakan isi logika Audio Play disini nanti)
       ==================================================================== */
    function playBGM() { console.log("BGM Play"); }
    function stopBGM() { console.log("BGM Stop"); }
    function playSoundItem() { console.log("SFX: Item Got!"); }
    function playSoundShoot() { console.log("SFX: Pew!"); }
    function playSoundExplosion() { console.log("SFX: Boom!"); }
    function playSoundGameOver() { console.log("SFX: Game Over!"); }
    function playSoundFlap() { /* Opsional: Suara kepak sayap */ }

    /* ====================================================================
       KONFIGURASI & VARIABEL GLOBAL
       ==================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const screens = {
        menu: document.getElementById('menu-screen'),
        bird: document.getElementById('bird-select-screen'),
        gameover: document.getElementById('gameover-screen'),
        leaderboard: document.getElementById('leaderboard-screen'),
        warning: document.getElementById('landscape-warning')
    };
    const ui = {
        score: document.getElementById('score-display'),
        fireBtn: document.getElementById('fire-btn'),
        shieldBar: document.getElementById('shield-bar'),
        shieldFill: document.getElementById('shield-fill')
    };

    let w, h;
    let gameState = 'MENU'; // MENU, BIRD, PLAY, GAMEOVER
    let isPaused = false;
    let animationId;

    // Profil Player
    let playerProfile = {
        name: "Player1",
        photo: "", // base64
        highscore: 0
    };
    
    // Burung
    const birdColors = [
        { id:1, name: "Biru", color: "#add8e6" },
        { id:2, name: "Pink", color: "#ffb6c1" },
        { id:3, name: "Merah", color: "#ff4c4c" },
        { id:4, name: "Kuning", color: "#fce803" },
        { id:5, name: "Hijau", color: "#90ee90" }
    ];
    let selectedBirdIdx = 0;

    // Game Variables
    let frames = 0;
    let score = 0;
    let obstaclesPassed = 0;
    let bgLevel = 0; // 0 sampai 4
    
    let bird = { x: 0, y: 0, w: 34, h: 26, velocity: 0, gravity: 0.25, jump: -5.5 };
    let pipes = [];
    let items = [];
    let bullets = [];
    let particles = [];
    let bgParticles = []; // Untuk sakura / bintang
    
    let gameTimeSeconds = 0;
    let lastTime = 0;

    // Powerup State
    let isShielded = false;
    let shieldTimer = 0; // max 5 detik
    let hasBullet = false;
    
    const PIPE_W = 60;
    const PIPE_SPEED = 2.125;

    /* ====================================================================
       INIT & EVENT LISTENERS UMUM
       ==================================================================== */
    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        checkOrientation();
    }
    window.addEventListener('resize', resize);
    
    function checkOrientation() {
        if (window.innerWidth > window.innerHeight && window.innerWidth > 600) {
            screens.warning.classList.remove('hidden');
            if(gameState === 'PLAY') isPaused = true;
        } else {
            screens.warning.classList.add('hidden');
            if(gameState === 'PLAY') {
                isPaused = false;
                lastTime = performance.now();
                gameLoop(lastTime); // Resume
            }
        }
    }

    // Load Data Local
    function loadData() {
        let data = localStorage.getItem('tapTapFlyData');
        if(data) {
            let parsed = JSON.parse(data);
            playerProfile.name = parsed.name || "Player1";
            playerProfile.photo = parsed.photo || "";
            document.getElementById('player-name').value = playerProfile.name;
            if(playerProfile.photo) {
                document.getElementById('menu-prof-pic').src = playerProfile.photo;
            } else {
                drawDefaultAvatar(document.getElementById('menu-prof-pic'));
            }
        } else {
            drawDefaultAvatar(document.getElementById('menu-prof-pic'));
        }
    }

    function saveData() {
        playerProfile.name = document.getElementById('player-name').value || "Player1";
        localStorage.setItem('tapTapFlyData', JSON.stringify(playerProfile));
    }

    // Default Avatar (Fallback)
    function drawDefaultAvatar(imgElement) {
        let tc = document.createElement('canvas');
        tc.width = 100; tc.height = 100;
        let tctx = tc.getContext('2d');
        tctx.fillStyle = '#ccc'; tctx.fillRect(0,0,100,100);
        tctx.fillStyle = '#fff'; tctx.font = '50px Fredoka One'; tctx.textAlign = 'center'; tctx.textBaseline='middle';
        tctx.fillText('?', 50, 50);
        imgElement.src = tc.toDataURL();
    }

    // File Upload Profile Pic
    document.getElementById('file-upload').addEventListener('change', function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const max_size = 150;
                let tc = document.createElement('canvas');
                let size = Math.min(img.width, img.height);
                tc.width = max_size; tc.height = max_size;
                let tctx = tc.getContext('2d');
                let sx = (img.width - size)/2;
                let sy = (img.height - size)/2;
                tctx.drawImage(img, sx, sy, size, size, 0, 0, max_size, max_size);
                
                let base64 = tc.toDataURL('image/jpeg', 0.8);
                document.getElementById('menu-prof-pic').src = base64;
                playerProfile.photo = base64;
                saveData();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    // Navigasi Menu
    document.getElementById('btn-play').addEventListener('click', () => {
        saveData();
        showScreen('bird');
        generateBirdSelection();
    });
    
    document.getElementById('btn-highscore').addEventListener('click', () => {
        saveData();
        showScreen('leaderboard');
        renderLeaderboard();
    });

    document.getElementById('btn-back-menu').addEventListener('click', () => showScreen('menu'));
    document.getElementById('btn-back-menu-from-bird').addEventListener('click', () => showScreen('menu'));
    
    document.getElementById('btn-start-game').addEventListener('click', () => {
        showScreen('game');
        startGame();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
        showScreen('game');
        startGame();
    });

    document.getElementById('btn-exit').addEventListener('click', () => {
        stopBGM();
        showScreen('menu');
    });

    function showScreen(screen) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        if(screen === 'menu') { screens.menu.classList.remove('hidden'); gameState = 'MENU'; }
        else if(screen === 'bird') { screens.bird.classList.remove('hidden'); gameState = 'BIRD'; }
        else if(screen === 'leaderboard') { screens.leaderboard.classList.remove('hidden'); gameState = 'MENU'; }
        else if(screen === 'gameover') { screens.gameover.classList.remove('hidden'); gameState = 'GAMEOVER'; }
        else if(screen === 'game') { gameState = 'PLAY'; }
    }

    /* ====================================================================
       BIRD SELECTION & DRAWING
       ==================================================================== */
    function drawCuteBird(ctx, x, y, size, color, flyFrame = 0) {
        ctx.save();
        ctx.translate(x, y);
        
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size*0.8, 0, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, size*0.1, size*0.7, 0, Math.PI, false);
        ctx.fillStyle = "#fff";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(size*0.4, -size*0.2, size*0.15, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(size*0.45, -size*0.2, size*0.06, 0, Math.PI*2);
        ctx.fillStyle = '#000'; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(size*0.8, 0);
        ctx.lineTo(size*1.2, 0);
        ctx.lineTo(size*0.8, size*0.3);
        ctx.fillStyle = '#FFA500'; ctx.fill(); ctx.stroke();

        let wingY = Math.sin(flyFrame * 0.5) * 5; 
        ctx.beginPath();
        ctx.ellipse(-size*0.2, wingY, size*0.4, size*0.25, -Math.PI/6, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill(); ctx.stroke();

        ctx.restore();
    }

    function generateBirdSelection() {
        const grid = document.getElementById('bird-grid');
        grid.innerHTML = '';
        birdColors.forEach((b, idx) => {
            let card = document.createElement('div');
            card.className = `bird-card ${idx === selectedBirdIdx ? 'selected' : ''}`;
            
            let canv = document.createElement('canvas');
            canv.className = 'bird-canvas';
            canv.width = 60; canv.height = 60;
            let cctx = canv.getContext('2d');
            drawCuteBird(cctx, 30, 30, 20, b.color, 0);
            
            let label = document.createElement('div');
            label.innerText = b.name; label.style.fontSize = '12px'; label.style.marginTop = '5px';

            card.appendChild(canv);
            card.appendChild(label);
            
            card.addEventListener('click', () => {
                selectedBirdIdx = idx;
                generateBirdSelection();
            });
            grid.appendChild(card);
        });
    }

    /* ====================================================================
       LEADERBOARD SYSTEM (FIREBASE REALTIME DATABASE)
       ==================================================================== */
    function getLeaderboardLocal() {
        let lb = localStorage.getItem('tapTapFlyLB');
        return lb ? JSON.parse(lb) : [];
    }

    function saveToLeaderboard(score) {
        if (score <= 0) return;

        // Backup simpan ke localStorage
        let lbLocal = getLeaderboardLocal();
        lbLocal.push({ name: playerProfile.name, photo: playerProfile.photo, score: score });
        lbLocal.sort((a,b) => b.score - a.score);
        lbLocal = lbLocal.slice(0, 5);
        localStorage.setItem('tapTapFlyLB', JSON.stringify(lbLocal));

        // Kirim ke Firebase Realtime Database
        fetch(FIREBASE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: playerProfile.name || 'Player1',
                photo: playerProfile.photo || '',
                score: score,
                timestamp: Date.now()
            })
        })
        .then(res => res.json())
        .then(data => console.log("Skor berhasil dikirim ke Firebase!", data))
        .catch(err => console.error("Gagal mengirim skor ke Firebase:", err));
    }

    function renderLeaderboard() {
        const list = document.getElementById('lb-list');
        list.innerHTML = '<div class="lb-empty">🔄 Memuat data rekor...</div>';

        fetch(FIREBASE_URL)
        .then(response => response.json())
        .then(data => {
            let lbArray = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    let item = data[key];
                    if (item && typeof item.score === 'number') {
                        lbArray.push(item);
                    }
                });
                // Urutkan skor tertinggi ke terendah
                lbArray.sort((a, b) => b.score - a.score);
                // Ambil Top 5
                lbArray = lbArray.slice(0, 5);
            }

            if (lbArray.length === 0) {
                lbArray = getLeaderboardLocal();
            }

            displayLeaderboardList(lbArray);
        })
        .catch(err => {
            console.error("Gagal koneksi ke Firebase, menampilkan offline leaderboard:", err);
            displayLeaderboardList(getLeaderboardLocal());
        });
          }
function displayLeaderboardList(lb) {
        const list = document.getElementById('lb-list');
        list.innerHTML = '';
        if(!lb || lb.length === 0) {
            list.innerHTML = '<div class="lb-empty">🏆<br>Belum ada rekor.<br>Jadilah yang pertama!</div>';
            return;
        }
        const medals = ['🥇', '🥈', '🥉'];
        lb.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'lb-item' + (index < 3 ? ' lb-rank-' + (index + 1) : '');

            let imgHtml = item.photo ? `<img src="${item.photo}">` : `<div class="lb-default-pic">?</div>`;
            let rankLabel = index < 3 ? medals[index] : ('#' + (index + 1));

            div.innerHTML = `
                <div class="lb-info">
                    <b class="lb-rank">${rankLabel}</b>
                    ${imgHtml}
                    <span class="lb-name">${escapeHtml(item.name || 'Player')}</span>
                </div>
                <div class="lb-score">${item.score}</div>
            `;
            list.appendChild(div);
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ====================================================================
       GAME ENGINE & LOGIC
       ==================================================================== */
    function startGame() {
        bird.x = w * 0.3;
        bird.y = h / 2;
        bird.velocity = 0;
        
        pipes = [];
        items = [];
        bullets = [];
        particles = [];
        bgParticles = [];
        
        frames = 0;
        score = 0;
        obstaclesPassed = 0;
        bgLevel = 0;
        gameTimeSeconds = 0;
        
        isShielded = false;
        shieldTimer = 0;
        hasBullet = false;
        ui.fireBtn.style.display = 'none';
        ui.shieldBar.style.display = 'none';
        ui.score.innerText = "0";

        initBgParticles();
        playBGM();
        
        lastTime = performance.now();
        if(animationId) cancelAnimationFrame(animationId);
        gameLoop(lastTime);
    }

    function fly() {
        if (gameState !== 'PLAY' || isPaused) return;
        bird.velocity = bird.jump;
        playSoundFlap();
    }
    
    window.addEventListener('touchstart', (e) => {
        if(e.target.id === 'fire-btn') return;
        fly();
    }, {passive: false});
    window.addEventListener('mousedown', (e) => {
        if(e.target.id === 'fire-btn') return;
        fly();
    });

    ui.fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    ui.fireBtn.addEventListener('mousedown', (e) => { e.preventDefault(); shoot(); });

    function shoot() {
        if(hasBullet && gameState === 'PLAY' && !isPaused) {
            hasBullet = false;
            ui.fireBtn.style.display = 'none';
            playSoundShoot();
            bullets.push({ x: bird.x + bird.w, y: bird.y, w: 15, h: 8, speed: 10 });
        }
    }

    function updateScoreUI() {
        ui.score.innerText = score;
        ui.score.classList.remove('score-pop');
        void ui.score.offsetWidth;
        ui.score.classList.add('score-pop');
    }

    function createExplosion(x, y, color) {
        playSoundExplosion();
        for(let i=0; i<20; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 30, maxLife: 30, color: color, size: Math.random()*5 + 3
            });
        }
    }

    function gameLoop(currentTime) {
        if (gameState !== 'PLAY') return;
        if (isPaused) {
            animationId = requestAnimationFrame(gameLoop);
            return;
        }

        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        gameTimeSeconds += dt;

        update(dt);
        draw();

        animationId = requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        frames++;

        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (bird.y + bird.h/2 >= h || bird.y - bird.h/2 <= 0) {
            gameOver();
        }

        // --- PIPES ---
        if (frames % 100 === 0) {
            let gap = 184 - (bgLevel * 5);
            if (gap < 115) gap = 115;
            let pipeY = Math.random() * (h - gap - 100) + 50;
            pipes.push({ x: w, y: pipeY, w: PIPE_W, gap: gap, passed: false });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= PIPE_SPEED;

            if (!p.passed && bird.x > p.x + p.w) {
                p.passed = true;
                obstaclesPassed++;
                score += 10;
                updateScoreUI();
                
                if(obstaclesPassed % 15 === 0) {
                    bgLevel = (bgLevel + 1) % 5;
                    initBgParticles();
                }
            }

            if (!isShielded) {
                if (bird.x + bird.w/2 > p.x && bird.x - bird.w/2 < p.x + p.w &&
                    bird.y - bird.h/2 < p.y) {
                    gameOver();
                }
                if (bird.x + bird.w/2 > p.x && bird.x - bird.w/2 < p.x + p.w &&
                    bird.y + bird.h/2 > p.y + p.gap) {
                    gameOver();
                }
            }

            if (p.x + p.w < 0) {
                pipes.splice(i, 1);
            }
        }

        // --- ITEMS SPAWN ---
        if (gameTimeSeconds % 15 < dt && gameTimeSeconds > 5) {
            items.push({ x: w, y: Math.random()*(h-200)+100, type: 'shield', r: 15 });
        }
        if (gameTimeSeconds % 25 < dt && gameTimeSeconds > 5) {
            items.push({ x: w, y: Math.random()*(h-200)+100, type: 'shoot', r: 15 });
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.x -= PIPE_SPEED;
            item.y += Math.sin(frames * 0.05) * 1;

            let dx = bird.x - item.x;
            let dy = bird.y - item.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < bird.w/2 + item.r) {
                playSoundItem();
                if (item.type === 'shield') {
                    isShielded = true;
                    shieldTimer = 5;
                    ui.shieldBar.style.display = 'block';
                } else if (item.type === 'shoot') {
                    hasBullet = true;
                    ui.fireBtn.style.display = 'flex';
                }
                items.splice(i, 1);
                continue;
            }

            if (item.x + item.r < 0) items.splice(i, 1);
        }

        if (isShielded) {
            shieldTimer -= dt;
            ui.shieldFill.style.width = (shieldTimer / 5 * 100) + "%";
            if (shieldTimer <= 0) {
                isShielded = false;
                ui.shieldBar.style.display = 'none';
            }
        }

        // --- BULLETS LOGIC ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.speed;
            
            let hit = false;
            for(let j = 0; j < pipes.length; j++) {
                let p = pipes[j];
                if (b.x + b.w > p.x && b.x < p.x + p.w) {
                    if (b.y < p.y || b.y > p.y + p.gap) {
                        createExplosion(p.x + p.w/2, p.y - 20, '#55cc55');
                        createExplosion(p.x + p.w/2, p.y + p.gap + 20, '#55cc55');
                        pipes.splice(j, 1);
                        hit = true;
                        
                        if(!p.passed) {
                            obstaclesPassed++;
                            score += 10;
                            updateScoreUI();
                            if(obstaclesPassed % 15 === 0) { bgLevel = (bgLevel + 1) % 5; initBgParticles(); }
                        }
                        break;
                    }
                }
            }
            
            if(hit) { bullets.splice(i, 1); continue; }
            if (b.x > w) bullets.splice(i, 1);
        }

        // --- PARTICLES ---
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // --- BG PARTICLES ---
        for (let i = 0; i < bgParticles.length; i++) {
            let p = bgParticles[i];
            p.x += p.vx; p.y += p.vy;
            if(bgLevel === 1) {
                if(p.y > h) { p.y = -10; p.x = Math.random()*w; }
            } else if (bgLevel === 3) {
                if(p.x < 0) { p.x = w; p.y = Math.random()*h; }
            }
        }
    }

    /* ====================================================================
       DRAWING ROUTINES
       ==================================================================== */
  
  function initBgParticles() {
        bgParticles = [];
        if (bgLevel === 1) {
            for(let i=0; i<30; i++) {
                bgParticles.push({
                    x: Math.random()*w, y: Math.random()*h,
                    vx: -1 - Math.random(), vy: 1 + Math.random()*2,
                    size: Math.random()*4 + 2, angle: Math.random()*360
                });
            }
        } else if (bgLevel === 2 || bgLevel === 3) {
            for(let i=0; i<50; i++) {
                bgParticles.push({
                    x: Math.random()*w, y: Math.random()*h,
                    vx: bgLevel===3 ? -0.5 - Math.random() : 0, vy: 0,
                    size: Math.random()*2 + 1, twinkle: Math.random()
                });
            }
        }
    }

function drawBackground() {
        let grad = ctx.createLinearGradient(0, 0, 0, h);
        
        if (bgLevel === 0) {
            grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath(); ctx.arc(w*0.2 - (frames*0.2)%w, h*0.2, 30, 0, Math.PI*2); ctx.arc(w*0.2+30 - (frames*0.2)%w, h*0.2+10, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w*0.8 - (frames*0.1)%w, h*0.3, 40, 0, Math.PI*2); ctx.arc(w*0.8-30 - (frames*0.1)%w, h*0.3+10, 30, 0, Math.PI*2); ctx.fill();
        } 
        else if (bgLevel === 1) {
            grad.addColorStop(0, '#FFB7C5'); grad.addColorStop(1, '#FFE4E1');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#FF69B4';
            bgParticles.forEach(p => {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(frames*0.05 + p.angle);
                ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size/2, 0, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });
        }
        else if (bgLevel === 2) {
            grad.addColorStop(0, '#0B0B2A'); grad.addColorStop(1, '#1A1A4A');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#FFF8DC'; ctx.beginPath(); ctx.arc(w*0.8, h*0.15, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFF';
            bgParticles.forEach(p => {
                let alpha = Math.abs(Math.sin(frames*0.02 + p.twinkle*10));
                ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        else if (bgLevel === 3) {
            grad.addColorStop(0, '#000000'); grad.addColorStop(1, '#2E0854');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#FF4500'; ctx.beginPath(); ctx.arc(w*0.2, h*0.7, 60, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFF';
            bgParticles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
        }
        else if (bgLevel === 4) {
            grad.addColorStop(0, '#FF4E50'); grad.addColorStop(0.5, '#F9D423'); grad.addColorStop(1, '#FF8008');
            ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath(); ctx.arc(w/2, h, w*0.4, 0, Math.PI, true); ctx.fill();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        
        drawBackground();

        ctx.fillStyle = '#73BF2E';
        ctx.strokeStyle = '#548F22';
        ctx.lineWidth = 4;
        pipes.forEach(p => {
            ctx.fillRect(p.x, 0, p.w, p.y);
            ctx.strokeRect(p.x, 0, p.w, p.y);
            ctx.fillRect(p.x-5, p.y-20, p.w+10, 20); ctx.strokeRect(p.x-5, p.y-20, p.w+10, 20);
            
            let bottomY = p.y + p.gap;
            ctx.fillRect(p.x, bottomY, p.w, h - bottomY);
            ctx.strokeRect(p.x, bottomY, p.w, h - bottomY);
            ctx.fillRect(p.x-5, bottomY, p.w+10, 20); ctx.strokeRect(p.x-5, bottomY, p.w+10, 20);
        });

        items.forEach(item => {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.r, 0, Math.PI*2);
            if(item.type === 'shield') {
                ctx.fillStyle = 'rgba(173, 216, 230, 0.8)';
                ctx.strokeStyle = '#00ffff';
            } else {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                ctx.strokeStyle = '#ffcccc';
            }
            ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(item.x - item.r*0.3, item.y - item.r*0.3, item.r*0.2, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.fill();
        });

        ctx.fillStyle = '#ffcc00'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        bullets.forEach(b => {
            ctx.beginPath(); ctx.ellipse(b.x, b.y, b.w, b.h, 0, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'rgba(255,0,0,0.5)'; ctx.beginPath(); ctx.arc(b.x - b.w, b.y, 4, 0, Math.PI*2); ctx.fill();
        });

        particles.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        let color = birdColors[selectedBirdIdx].color;
        if (isShielded) {
            ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.w, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.4)'; ctx.fill();
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
        }
        drawCuteBird(ctx, bird.x, bird.y, bird.w/2, color, frames);
  }

  function gameOver() {
        gameState = 'GAMEOVER';
        playSoundGameOver();
        stopBGM();

        createExplosion(bird.x, bird.y, birdColors[selectedBirdIdx].color);
        draw();
        
        let storedScore = parseInt(playerProfile.highscore) || 0;
        let isNewHigh = score > storedScore && score > 0;
        if(score > storedScore) {
            playerProfile.highscore = score;
            saveData();
        }

        // Simpan skor ke Firebase & LocalStorage
        saveToLeaderboard(score);

        setTimeout(() => {
            document.getElementById('go-score').innerText = "Score: " + score;
            document.getElementById('go-highscore').innerText = "Highscore: " + playerProfile.highscore;
            document.getElementById('new-high-badge').classList.toggle('hidden', !isNewHigh);
            showScreen('gameover');
        }, 800);
    }

    // Init Paling Awal
    resize();
    loadData();

</script>
